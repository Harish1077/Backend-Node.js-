<!DOCTYPE html>
<html>
<head>
    <title>Socket.IO + express-session Visitor Tracker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { border: 1px solid #000; padding: 20px; max-width: 500px; }
        .inner-box { border: 1px solid #888; padding: 15px; height: 150px; }
    </style>
</head>
<body>

    <h2>Socket.IO + express-session Visitor Tracker</h2>
    
    <div class="container">
        <div class="inner-box" id="display">
            <p>Waiting for connection...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const display = document.getElementById('display');

        socket.on('visitorData', (data) => {
            display.innerHTML = `
                <p>Session ID: ${data.sessionID}</p>
                <p>Name: ${data.name}</p>
                <p>Join Time: ${data.joinTime}</p>
            `;
        });
    </script>
</body>
</html>
